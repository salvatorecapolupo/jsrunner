<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<title>JS Playground Semplice</title>
<style>
  body { font-family: sans-serif; padding: 20px; background: #f3f3f3; }
  textarea { width: 100%; height: 200px; font-family: monospace; font-size: 14px; }
  #console { background: #111; color: #0f0; padding: 10px; height: 160px; overflow-y: auto; margin-top: 10px; font-family: monospace; }
  button { padding: 8px 12px; margin-top: 10px; }
</style>
</head>
<body>

<h2>JS Playground</h2>
<p>Modifica il codice qui sotto e premi RUN:</p>

<textarea id="code">
function sayHi() {
  console.log(name);
  console.log(age);
  var name = 'Lydia';
  let age = 21;
}

sayHi();
</textarea>

<br>
<button onclick="runCode()">RUN ▶</button>

<h3>Console:</h3>
<div id="console"></div>

<script>
function runCode() {
  const code = document.getElementById("code").value;
  const consoleDiv = document.getElementById("console");

  // pulisci la console
  consoleDiv.innerHTML = "";

  // intercetta console.log
  const originalLog = console.log;
  console.log = function(...args) {
    args.forEach(a => {
      const line = document.createElement("div");
      line.textContent = "> " + a;
      consoleDiv.appendChild(line);
    });
    originalLog.apply(console, args);
  };

  // esegui il codice usando Function()
  try {
    new Function(code)();
  } catch (err) {
    const line = document.createElement("div");
    line.style.color = "red";
    line.textContent = "ERR: " + err;
    consoleDiv.appendChild(line);
  }

  // ripristina console.log
  console.log = originalLog;
}
</script>

</body>
</html>

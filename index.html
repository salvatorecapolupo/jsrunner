<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Microlearning JS Playground</title>
<style>
  :root{--bg:#0f1724;--panel:#0b1220;--accent:#06b6d4;--muted:#94a3b8;--card:#0b1220;--light:#e6eef6}
  body{font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial; margin:0; background:linear-gradient(180deg,#071028 0%, #07192b 100%); color:var(--light); height:100vh; display:flex; flex-direction:column;}
  header{padding:14px 18px; display:flex; gap:12px; align-items:center; border-bottom:1px solid rgba(255,255,255,0.03)}
  h1{font-size:16px;margin:0}
  .container{display:grid; grid-template-columns: 420px 1fr 420px; gap:12px; padding:12px; flex:1; min-height:0;}
  .panel{background:rgba(255,255,255,0.03); border-radius:10px; padding:12px; box-shadow: 0 6px 20px rgba(2,6,23,0.6); overflow:auto}
  .list{display:flex; flex-direction:column; gap:8px; max-height:60vh; overflow:auto; padding-right:6px}
  .example-btn{background:transparent; color:var(--light); border:1px solid rgba(255,255,255,0.04); padding:8px; border-radius:8px; text-align:left; cursor:pointer;}
  .example-btn.active{border-color:var(--accent); box-shadow: 0 6px 18px rgba(6,182,212,0.08); background:linear-gradient(180deg, rgba(6,182,212,0.04), transparent)}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
  textarea{width:100%; height: calc(100% - 90px); min-height:220px; resize:vertical; background:#071428; color: #dbeafe; border:1px solid rgba(255,255,255,0.04); padding:10px; font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", "Courier New", monospace; font-size:13px; border-radius:8px}
  .controls{display:flex; gap:8px; margin-top:8px}
  button.run{background:var(--accent); color:#012; border:none; padding:10px 12px; border-radius:8px; cursor:pointer}
  button.secondary{background:transparent; border:1px solid rgba(255,255,255,0.04); color:var(--light); padding:8px 10px; border-radius:8px; cursor:pointer}
  .preview{display:flex; flex-direction:column; gap:8px; min-height:0}
  .iframe-wrap{flex:1; border-radius:8px; overflow:hidden; border:1px solid rgba(255,255,255,0.04)}
  iframe.preview-frame{width:100%; height:100%; border:0; background:white}
  .right-col{display:flex; flex-direction:column; gap:8px}
  .explain{font-size:13px; color:var(--muted); padding:8px; border-radius:8px; background:linear-gradient(180deg, rgba(255,255,255,0.01), transparent)}
  footer{padding:10px 16px; font-size:13px; color:var(--muted); border-top:1px solid rgba(255,255,255,0.03)}
  .meta{font-size:12px;color:var(--muted)}
  .small{font-size:12px;color:var(--muted)}
  .top-row{display:flex; gap:8px; align-items:center}
  .download-link{color:var(--accent); text-decoration:none;}
  .examples-header{display:flex; align-items:center; justify-content:space-between; gap:8px}
</style>
</head>
<body>
<header>
  <div>
    <h1>Microlearning JS — Playground</h1>
    <div class="meta">10 esempi difficili ma non troppo — editali e premi <strong>Run</strong></div>
  </div>
</header>

<div class="container">
  <div class="panel">
    <div class="examples-header">
      <label style="margin:0">Esempi</label>
      <div class="small">Seleziona → Modifica → Run</div>
    </div>
    <div class="list" id="examplesList" role="list"></div>
  </div>

  <div class="panel preview">
    <div style="display:flex; gap:8px; align-items:center;">
      <div style="flex:1">
        <label>Editor</label>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="run" id="runBtn">Run ▶</button>
        <button class="secondary" id="resetBtn">Reset</button>
        <button class="secondary" id="downloadBtn">Download .html</button>
      </div>
    </div>

    <textarea id="editor" spellcheck="false"></textarea>
    <div style="display:flex; gap:8px; margin-top:8px; align-items:center;">
      <label style="margin:0">Spiegazione</label>
      <div id="explanation" style="margin-left:8px; color:var(--muted)"></div>
    </div>
  </div>

  <div class="panel right-col">
    <label>Preview (risultato + console)</label>
    <div class="iframe-wrap" style="height:70vh">
      <iframe id="previewFrame" class="preview-frame"></iframe>
    </div>
    <div class="explain">
      L'iframe riceve il codic
